<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Meal Plan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#FFF3E1;
    --bg-elevated:#FFE7C2;
    --board-line:#F1DBAE;
    --paper:#FFFFFF;
    --paper-2:#FFF3DE;
    --paper-line:#F0DEBE;
    --ink:#33291C;
    --ink-soft:#8C7C63;
    --mustard:#FFB238;
    --mustard-ink:#5C3A00;
    --brick:#FF6B4A;
    --brick-dark:#E1502F;
    --sage:#2FB6A3;
    --sage-dark:#1D8577;
    --radius:12px;
    --shadow:0 8px 20px rgba(150,90,30,.16);
    --font-display:Georgia,'Iowan Old Style','Palatino Linotype',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #FFEACB 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100%;
    padding-bottom:40px;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  .app{max-width:560px;margin:0 auto;padding:18px 16px 8px;}

  /* Top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .brand{display:flex;flex-direction:column;line-height:1;}
  .brand .kicker{font-size:11px;letter-spacing:.04em;color:var(--sage-dark);margin-bottom:4px;}
  .brand h1{font-family:var(--font-display);font-weight:700;font-size:26px;margin:0;color:var(--ink);}
  .iconbtn{
    background:var(--bg-elevated);border:1px solid var(--board-line);color:var(--ink);
    width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:18px;flex:none;
  }
  .iconbtn:active{transform:scale(.94);}

  /* Stamp-style plan button */
  .plan-row{display:flex;gap:10px;align-items:stretch;margin:6px 0 20px;}
  .stamp-btn{
    display:block;flex:1;text-align:center;
    background:var(--brick);color:#FBF4E6;
    border:2px solid #E7C79A;
    border-radius:10px;
    padding:14px 10px;
    font-family:var(--font-display);
    font-size:19px;font-weight:700;letter-spacing:.02em;
    box-shadow:var(--shadow);
    transform:rotate(-0.6deg);
    margin:0;
    position:relative;
  }
  .stamp-btn:active{transform:rotate(-0.6deg) scale(.98);}
  .stamp-btn .sub{display:block;font-family:var(--font-body);font-weight:400;font-size:11.5px;opacity:.85;margin-top:2px;letter-spacing:.02em;}
  .dl-btn{
    flex:none;width:56px;
    background:var(--bg-elevated);border:2px solid var(--board-line);border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--ink);
    box-shadow:var(--shadow);
  }
  .dl-btn:active{transform:scale(.95);}

  /* Week nav */
  .weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 2px;}
  .weeknav .range{font-family:var(--font-display);font-size:17px;color:var(--ink);text-align:center;}
  .weeknav .range small{display:block;font-family:var(--font-body);font-size:11px;color:var(--sage-dark);margin-top:2px;letter-spacing:.03em;}
  .navbtn{background:none;border:none;color:var(--ink);font-size:22px;padding:4px 10px;line-height:1;opacity:.7;}
  .navbtn:active{opacity:1;}

  /* Week card stack */
  .week-wrap{overflow:hidden;position:relative;touch-action:pan-y;}
  .daycard{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;position:relative;padding-left:14px;overflow:hidden;}
  .daycard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--brick);}
  .daycard .dayhead{display:flex;align-items:baseline;gap:8px;padding:10px 12px 4px;}
  .daycard .dayhead .dname{font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:15.5px;}
  .daycard .dayhead .ddate{font-size:12px;color:var(--ink-soft);}
  .daycard .dayhead .today-flag{margin-left:auto;font-size:10px;letter-spacing:.04em;color:var(--brick-dark);font-weight:700;background:rgba(181,72,45,.12);padding:2px 6px;border-radius:6px;}
  .meal-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px dashed var(--paper-line);}
  .meal-row .meal-label{width:52px;flex:none;font-size:11px;letter-spacing:.03em;color:var(--ink-soft);text-transform:lowercase;}
  .meal-row .slot{flex:1;min-height:36px;display:flex;flex-direction:column;justify-content:center;border-radius:8px;padding:6px 10px;}
  .slot.empty{border:1.5px dashed var(--paper-line);color:var(--ink-soft);font-size:13.5px;}
  .slot.planned{background:var(--paper-2);}
  .slot.planned .rname{color:var(--ink);font-weight:600;font-size:14px;}
  .slot.planned .rcat{color:var(--sage-dark);font-size:11px;margin-top:1px;}
  .slot.out{background:rgba(47,182,163,.13);color:var(--sage-dark);font-size:13px;font-style:italic;}
  .slot:active{filter:brightness(.97);}
  .empty-week-hint{text-align:center;color:var(--ink-soft);font-size:13px;padding:18px 10px 6px;line-height:1.5;}

  /* Modal / overlay */
  .overlay{position:fixed;inset:0;background:rgba(15,20,15,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fadein .15s ease-out;}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @media(min-width:620px){.overlay{align-items:center;}}
  .modal{background:var(--paper);color:var(--ink);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:20px 18px 22px;max-height:88vh;overflow-y:auto;}
  @media(min-width:620px){.modal{border-radius:16px;}}
  .modal h2{font-family:var(--font-display);margin:0 0 4px;font-size:21px;color:var(--ink);}
  .modal .desc{color:var(--ink-soft);font-size:13.5px;margin:0 0 16px;line-height:1.4;}
  .steps-dots{display:flex;gap:6px;margin-bottom:14px;}
  .steps-dots span{height:5px;flex:1;background:var(--paper-line);border-radius:3px;}
  .steps-dots span.active{background:var(--brick);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.01em;}
  .field input[type=date],.field input[type=text],.field input[type=number],.field textarea,.field select{
    width:100%;padding:11px 12px;border-radius:8px;border:1.5px solid var(--paper-line);
    background:#fff;font-size:15px;color:var(--ink);font-family:var(--font-body);
  }
  .field textarea{resize:vertical;line-height:1.4;}
  .checklist{border:1px solid var(--paper-line);border-radius:10px;overflow:hidden;}
  .checklist .crow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--paper-line);font-size:14px;background:#fff;}
  .checklist .crow:last-child{border-bottom:none;}
  .checklist .crow .cname{flex:1;color:var(--ink);}
  .checklist .crow .cname small{display:block;color:var(--ink-soft);font-size:11.5px;}
  .checklist input[type=checkbox]{width:19px;height:19px;accent-color:var(--brick);}
  .btnrow{display:flex;gap:10px;margin-top:18px;}
  .btn{flex:1;padding:13px 10px;border-radius:9px;border:none;font-size:15px;font-weight:600;text-align:center;}
  .btn.primary{background:var(--brick);color:#FBF4E6;}
  .btn.primary:disabled{opacity:.45;}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--paper-line);}
  .btn.small{padding:8px 12px;font-size:13px;flex:none;}
  .btn.danger{background:transparent;color:var(--brick-dark);border:1.5px solid rgba(181,72,45,.4);}

  /* chips (meal base / meal type multi-select) */
  .chip-group{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{padding:7px 13px;border-radius:16px;border:1.5px solid var(--paper-line);background:#fff;font-size:12.5px;color:var(--ink-soft);}
  .chip.active{background:var(--brick);border-color:var(--brick);color:#fff;}
  .chip.type-chip.active{background:var(--sage-dark);border-color:var(--sage-dark);color:#fff;}
  .chip.season-chip{text-transform:capitalize;font-size:11px;padding:5px 10px;}
  .chip.season-chip.active{background:var(--brick-dark);border-color:var(--brick-dark);color:#fff;}
  .season-row{flex:1 1 100%;display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .season-label{font-size:11px;color:var(--ink-soft);flex:none;}

  /* recipe picker (slot editor) */
  .picker-cat{margin-bottom:10px;}
  .picker-cat h4{margin:0 0 6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--sage-dark);}
  details.picker-cat{border:1px solid var(--paper-line);border-radius:10px;background:#fff;overflow:hidden;}
  details.picker-cat summary{list-style:none;cursor:pointer;padding:11px 12px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--sage-dark);display:flex;justify-content:space-between;align-items:center;}
  details.picker-cat summary::-webkit-details-marker{display:none;}
  details.picker-cat summary::after{content:'▸';font-size:11px;color:var(--ink-soft);transition:transform .15s;margin-left:auto;padding-left:8px;}
  details.picker-cat[open] summary::after{transform:rotate(90deg);}
  details.picker-cat summary .bname{flex:1;}
  details.picker-cat summary .count{font-size:11px;color:var(--ink-soft);text-transform:none;letter-spacing:0;margin-left:8px;}
  details.picker-cat .opts{padding:0 12px 12px;}
  details.picker-cat .opts .picker-opt:last-child{margin-bottom:0;}
  .picker-opt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--paper-line);border-radius:8px;background:#fff;margin-bottom:6px;font-size:14px;}
  .picker-opt .meta{color:var(--ink-soft);font-size:11.5px;}
  .picker-opt:active{background:var(--paper-2);}

  /* settings */
  .settings-wrap{padding-top:4px;}
  .cat-card{background:var(--paper);border-radius:12px;padding:14px 14px 12px;margin-bottom:14px;box-shadow:var(--shadow);color:var(--ink);}
  .section-title{font-family:var(--font-display);font-size:16px;margin:0 0 4px;color:var(--ink);}
  .section-desc{font-size:12px;color:var(--ink-soft);margin:0 0 10px;line-height:1.4;}
  .rule-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;border-top:1px dashed var(--paper-line);}
  .rule-row:first-child{border-top:none;}
  .rule-row input[type=text]{flex:1 1 100%;font-family:var(--font-display);font-weight:700;font-size:15px;border:none;background:transparent;color:var(--ink);padding:2px 0;}
  .target-stepper{display:flex;align-items:center;gap:6px;flex:none;}
  .target-stepper button{width:26px;height:26px;border-radius:6px;border:1px solid var(--paper-line);background:#fff;color:var(--ink);font-size:15px;line-height:1;}
  .target-stepper .tval{width:52px;text-align:center;font-size:12px;color:var(--ink-soft);}
  .rule-row select{flex:none;border:1px solid var(--paper-line);border-radius:6px;font-size:11px;padding:5px;background:#fff;color:var(--ink);}
  .busy-toggle{flex:1 1 100%;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .busy-toggle input{width:15px;height:15px;accent-color:var(--brick);}
  .del-x{background:none;border:none;color:var(--ink-soft);font-size:16px;padding:0 2px;flex:none;}
  .add-cat-form{display:flex;gap:8px;margin-top:10px;}
  .add-cat-form input{flex:1;padding:11px 12px;border-radius:9px;border:1.5px dashed var(--paper-line);background:#fff;color:var(--ink);font-size:14px;}
  .add-cat-form input::placeholder{color:var(--ink-soft);}
  .add-cat-form button{background:var(--mustard);color:var(--mustard-ink);border:none;border-radius:9px;padding:0 18px;font-weight:700;}
  .recipe-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px dashed var(--paper-line);}
  .recipe-row:first-child{border-top:none;}
  .recipe-row .rinfo .rn{color:var(--ink);font-size:14px;}
  .recipe-row .rinfo .rmeta{color:var(--ink-soft);font-size:11.5px;margin-top:2px;}
  .recipe-row .chev{color:var(--ink-soft);font-size:17px;flex:none;}
  .backup-row{display:flex;gap:10px;margin-top:22px;}
  .backup-row .btn{background:var(--bg-elevated);color:var(--ink);border:1px solid var(--board-line);}
  .hint{color:var(--ink-soft);font-size:11.5px;text-align:center;margin-top:10px;line-height:1.5;}
  #fileimport{display:none;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:10px 18px;border-radius:20px;font-size:13.5px;box-shadow:var(--shadow);z-index:99;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="overlayRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   STORAGE + MIGRATION
   ============================================================ */
const STORE_KEY = 'mealPlan.v3';
const V2_KEY = 'mealPlan.v2';
const V1_KEY = 'mealPlan.v1';

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }

function seedDefaultState(){
  const mealBases = ['Pasta','Rice','Potato','Noodles','Bread','Salad'].map(name=>({id:uid(), name, weeklyTarget:1, excludedSeasons:[]}));
  const mealTypes = [
    {id:uid(), name:'Mindless', weeklyMin:0, slotPref:null, busyDay:true},
    {id:uid(), name:'Easy', weeklyMin:0, slotPref:null, busyDay:false},
    {id:uid(), name:'Good for lunch', weeklyMin:0, slotPref:'lunch', busyDay:false},
    {id:uid(), name:'Good for dinner', weeklyMin:0, slotPref:'dinner', busyDay:false}
  ];
  return { mealBases, mealTypes, recipes:[], days:{}, lastViewedWeekStart:null };
}
function migrateFromV1(old){
  const mealBases = (old.categories||[]).map(c=>({id:c.id, name:c.name, weeklyTarget:c.weeklyTarget||0, excludedSeasons:[]}));
  const mealTypes = [
    {id:uid(), name:'Mindless', weeklyMin:0, slotPref:null, busyDay:true},
    {id:uid(), name:'Easy', weeklyMin:0, slotPref:null, busyDay:false},
    {id:uid(), name:'Good for lunch', weeklyMin:0, slotPref:'lunch', busyDay:false},
    {id:uid(), name:'Good for dinner', weeklyMin:0, slotPref:'dinner', busyDay:false}
  ];
  const recipes = (old.recipes||[]).map(r=>({
    id:r.id, name:r.name,
    baseIds: r.categoryId ? [r.categoryId] : [],
    typeIds: [],
    frequencyWeeks: r.frequencyWeeks||1,
    multiply: !!r.multiply,
    lastUsedWeekStart: r.lastUsedWeekStart||null,
    ephemeral:false
  }));
  const weeks = {};
  Object.keys(old.weeks||{}).forEach(k=>{
    const wk = old.weeks[k];
    weeks[k] = {
      startDate: wk.startDate,
      days: wk.days.map(d=>({
        date:d.date,
        lunch: migrateSlotV1(d.lunch),
        dinner: migrateSlotV1(d.dinner)
      }))
    };
  });
  return { mealBases, mealTypes, recipes, weeks, lastViewedWeekStart: old.lastViewedWeekStart||null };
}
function migrateSlotV1(s){
  if(!s) return {status:'empty', recipeId:null, recipeName:null, baseLabel:null};
  return {status:s.status, recipeId:s.recipeId||null, recipeName:s.recipeName||null, baseLabel:s.categoryName||null};
}
function flattenWeeksToDays(obj){
  const days = {};
  Object.values(obj.weeks||{}).forEach(week=>{
    (week.days||[]).forEach(d=>{ days[d.date] = {lunch:d.lunch, dinner:d.dinner}; });
  });
  return { mealBases: obj.mealBases, mealTypes: obj.mealTypes, recipes: obj.recipes, days, lastViewedWeekStart: obj.lastViewedWeekStart||null };
}
function loadState(){
  try{
    const rawV3 = localStorage.getItem(STORE_KEY);
    if(rawV3) return JSON.parse(rawV3);
    const rawV2 = localStorage.getItem(V2_KEY);
    if(rawV2) return flattenWeeksToDays(JSON.parse(rawV2));
    const rawV1 = localStorage.getItem(V1_KEY);
    if(rawV1) return flattenWeeksToDays(migrateFromV1(JSON.parse(rawV1)));
  }catch(e){}
  return seedDefaultState();
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
let state = loadState();
function ensureBusyDayDefault(){
  if(!state.mealTypes.some(t=>t.busyDay)){
    const m = state.mealTypes.find(t=>t.name.trim().toLowerCase()==='mindless');
    if(m) m.busyDay = true;
  }
}
ensureBusyDayDefault();

/* ============================================================
   FIREBASE (live share)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBWyu_dYoZ2x0NXw1JJ-DcEAD6fEHmxCzk",
  authDomain: "meal-plan-2c5b0.firebaseapp.com",
  projectId: "meal-plan-2c5b0",
  storageBucket: "meal-plan-2c5b0.firebasestorage.app",
  messagingSenderId: "1094866173833",
  appId: "1:1094866173833:web:ac5618975734acd685ab58"
};
let firebaseDb = null;
try{
  firebase.initializeApp(firebaseConfig);
  firebaseDb = firebase.firestore();
}catch(e){ console.error('Firebase init failed', e); }

const SHARE_META_KEY = 'mealPlanShareMeta';
function loadShareMeta(){
  try{ const raw = localStorage.getItem(SHARE_META_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return { active:false, weekStart:null, shareId:null };
}
function saveShareMeta(){ localStorage.setItem(SHARE_META_KEY, JSON.stringify(shareMeta)); }
let shareMeta = loadShareMeta();
function ensureShareId(){
  if(!shareMeta.shareId){ shareMeta.shareId = uid()+uid(); saveShareMeta(); }
  return shareMeta.shareId;
}

/* ============================================================
   DATE HELPERS
   ============================================================ */
function toISO(d){ return d.toISOString().slice(0,10); }
function fromISO(iso){ return new Date(iso+'T12:00:00'); }
function addDays(iso,n){ const d=fromISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function todayISO(){ return toISO(new Date()); }
function weekDates(startISO){ return [0,1,2,3,4,5,6].map(i=>addDays(startISO,i)); }
function datesBetween(startISO, endISO){
  const dates = [];
  let cur = startISO, guard = 0;
  while(fromISO(cur) <= fromISO(endISO) && guard < 60){ dates.push(cur); cur = addDays(cur,1); guard++; }
  return dates.length ? dates : [startISO];
}
function weeksBetween(iso1, iso2){ return Math.round((fromISO(iso2)-fromISO(iso1))/(7*86400000)); }
function dayName(iso){ return fromISO(iso).toLocaleDateString(undefined,{weekday:'long'}); }
function dayShort(iso){ return fromISO(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function mondayOnOrBefore(iso){
  const d = fromISO(iso);
  const dow = d.getDay();
  const back = (dow===0)?6:dow-1;
  return addDays(iso, -back);
}
function getSeason(iso){
  const m = fromISO(iso).getMonth()+1; // 1-12, meteorological (Northern Hemisphere) seasons
  if(m===12||m===1||m===2) return 'winter';
  if(m>=3&&m<=5) return 'spring';
  if(m>=6&&m<=8) return 'summer';
  return 'autumn';
}
const SEASONS = ['winter','spring','summer','autumn'];

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'),1800);
}

/* ============================================================
   DATA ACCESS
   ============================================================ */
function emptySlot(){ return {status:'empty', recipeId:null, recipeName:null, baseLabel:null}; }
function peekDay(dateISO){ return state.days[dateISO] || {lunch:emptySlot(), dinner:emptySlot()}; }
function ensureDay(dateISO){
  if(!state.days[dateISO]) state.days[dateISO] = {lunch:emptySlot(), dinner:emptySlot()};
  return state.days[dateISO];
}
function getRecipe(id){ return state.recipes.find(r=>r.id===id); }
function getMealBase(id){ return state.mealBases.find(b=>b.id===id); }
function getMealType(id){ return state.mealTypes.find(t=>t.id===id); }
function baseNames(r){ return (r.baseIds||[]).map(id=>{const b=getMealBase(id); return b?b.name:null;}).filter(Boolean); }
function typeNames(r){ return (r.typeIds||[]).map(id=>{const t=getMealType(id); return t?t.name:null;}).filter(Boolean); }
function getOrCreateMealBase(name){
  let b = state.mealBases.find(b=>b.name.toLowerCase()===name.toLowerCase());
  if(!b){ b = {id:uid(), name, weeklyTarget:0}; state.mealBases.push(b); }
  return b;
}
function getOrCreateMealType(name){
  let t = state.mealTypes.find(t=>t.name.toLowerCase()===name.toLowerCase());
  if(!t){ t = {id:uid(), name, weeklyMin:0, slotPref:null}; state.mealTypes.push(t); }
  return t;
}
function removeIfEphemeral(r){
  if(r.ephemeral){ state.recipes = state.recipes.filter(x=>x.id!==r.id); }
}
function freqLabel(r){
  const parts = [];
  parts.push(!r.frequencyWeeks || r.frequencyWeeks<=1 ? 'weekly ok' : `every ${r.frequencyWeeks} wks`);
  if(r.multiply) parts.push('may repeat');
  return parts.join(' \u00b7 ');
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function parseList(text){ return (text||'').split(/[,\n]/).map(s=>s.trim()).filter(Boolean); }

function renderMealRow(date, meal, slot){
  let inner;
  if(slot.status==='out'){
    inner = `<div class="slot out">Out — no meal needed</div>`;
  } else if(slot.status==='planned' && (slot.recipeName || (slot.recipeId && getRecipe(slot.recipeId)))){
    const recipe = slot.recipeId ? getRecipe(slot.recipeId) : null;
    const name = slot.recipeName || (recipe ? recipe.name : '');
    const baseTxt = slot.baseLabel || (recipe ? baseNames(recipe).join(', ') : '');
    inner = `<div class="slot planned"><span class="rname">${escapeHtml(name)}</span><span class="rcat">${escapeHtml(baseTxt||'')}</span></div>`;
  } else {
    inner = `<div class="slot empty">+ add meal</div>`;
  }
  return `<div class="meal-row" data-date="${date}" data-meal="${meal}" onclick="openSlotEditor('${date}','${meal}')">
    <span class="meal-label">${meal}</span>${inner}
  </div>`;
}

function shiftWeek(n){
  viewWeekStart = addDays(viewWeekStart, n);
  state.lastViewedWeekStart = viewWeekStart;
  saveState();
  render();
}

function attachHomeHandlers(){
  const wrap = document.getElementById('weekWrap');
  if(wrap){
    let sx=0, sy=0, dragging=false;
    wrap.addEventListener('touchstart', e=>{
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; dragging=true;
    }, {passive:true});
    wrap.addEventListener('touchend', e=>{
      if(!dragging) return; dragging=false;
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
        shiftWeek(dx < 0 ? 7 : -7);
      }
    }, {passive:true});
  }

  const rangeLabel = document.getElementById('weekRangeLabel');
  if(rangeLabel) attachLongPress(rangeLabel, openClearWeekConfirm);
}

function attachLongPress(el, callback, duration){
  duration = duration || 550;
  let timer = null, moved = false;
  const start = ()=>{ moved = false; clearTimeout(timer); timer = setTimeout(()=>{ if(!moved) callback(); }, duration); };
  const cancel = ()=>{ clearTimeout(timer); };
  const move = ()=>{ moved = true; clearTimeout(timer); };
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchmove', move, {passive:true});
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
}

function openClearWeekConfirm(){

  const label = `${fromISO(days[0]).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} – ${fromISO(days[6]).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}`;

function openSlotEditor(date, meal){
  currentSlotDate = date; currentSlotMeal = meal;

  const shown = new Set();
  const baseSections = state.mealBases.map(b=>{
    const recs = state.recipes.filter(r=>!r.ephemeral && (r.baseIds||[]).includes(b.id));
    if(!recs.length) return '';
    recs.forEach(r=>shown.add(r.id));
    return `<details class="picker-cat"><summary><span class="bname">${escapeHtml(b.name)}</span><span class="count">${recs.length} recipe${recs.length===1?'':'s'}</span></summary><div class="opts">${recs.map(r=>`
      <div class="picker-opt" onclick="assignSlot('${date}','${meal}','${r.id}')">
        <span>${escapeHtml(r.name)}</span>
        <span class="meta">${escapeHtml(typeNames(r).join(', ')) || freqLabel(r)}</span>
      </div>`).join('')}</div></details>`;
  }).join('');
  const other = state.recipes.filter(r=>!r.ephemeral && !shown.has(r.id));
  const otherSection = other.length ? `<details class="picker-cat"><summary><span class="bname">Other</span><span class="count">${other.length} recipe${other.length===1?'':'s'}</span></summary><div class="opts">${other.map(r=>`
      <div class="picker-opt" onclick="assignSlot('${date}','${meal}','${r.id}')">
        <span>${escapeHtml(r.name)}</span>
        <span class="meta">${escapeHtml(typeNames(r).join(', ')) || freqLabel(r)}</span>
      </div>`).join('')}</div></details>` : '';
  const noneMsg = (!baseSections && !otherSection) ? `<p class="desc">No recipes yet — add one below.</p>` : '';

  const baseChips = state.mealBases.map(b=>`<button type="button" class="chip" data-id="${b.id}" onclick="toggleQaBase('${b.id}')">${escapeHtml(b.name)}</button>`).join('')
    + `<button type="button" class="chip" style="border-style:dashed;" onclick="qaNewBase()">+ new base</button>`;
  const typeChips = state.mealTypes.map(t=>`<button type="button" class="chip type-chip" data-id="${t.id}" onclick="toggleQaType('${t.id}')">${escapeHtml(t.name)}</button>`).join('')
    + `<button type="button" class="chip type-chip" style="border-style:dashed;" onclick="qaNewType()">+ new type</button>`;

  window.__qaDraft = { baseIds:[], typeIds:[] };

  showOverlay(`
    <h2>${dayName(date)} · ${meal}</h2>
    <p class="desc">${dayShort(date)}</p>
    <div class="btnrow" style="margin-top:0;margin-bottom:16px;">
      <button class="btn ghost" onclick="assignSlot('${date}','${meal}',null,'out')">Mark as out</button>
      <button class="btn ghost" onclick="assignSlot('${date}','${meal}',null,'empty')">Clear</button>
    </div>
    <input type="text" id="slotSearch" placeholder="Search recipes…" oninput="filterSlotRecipes()" style="width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--paper-line);font-size:14px;margin-bottom:14px;">
    <div id="slotRecipeList">
      ${baseSections}${otherSection}${noneMsg}
      <p class="desc" id="slotNoMatch" style="display:none;">No recipes match "<span id="slotNoMatchTerm"></span>".</p>
    </div>
    <div class="picker-cat">
      <h4>Add a new recipe</h4>
      <input type="text" id="qaName" placeholder="Recipe name" style="width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--paper-line);font-size:14px;margin-bottom:10px;">
      <div class="chip-group" style="margin-bottom:8px;" id="qaBaseChips">${baseChips}</div>
      <div class="chip-group" id="qaTypeChips">${typeChips}</div>
      <button class="btn primary small" style="width:100%;margin-top:10px;" onclick="quickAdd('${date}','${meal}')">Add &amp; use for this meal</button>
    </div>
  `);
}
function filterSlotRecipes(){
  const input = document.getElementById('slotSearch');
  const q = (input ? input.value : '').trim().toLowerCase();
  let totalVisible = 0;
  document.querySelectorAll('#slotRecipeList .picker-cat').forEach(details=>{
    let anyVisible = false;
    details.querySelectorAll('.picker-opt').forEach(opt=>{
      const match = !q || opt.textContent.toLowerCase().includes(q);
      opt.style.display = match ? '' : 'none';
      if(match){ anyVisible = true; totalVisible++; }
    });
    details.style.display = anyVisible ? '' : 'none';
    if(q) details.open = anyVisible; else details.removeAttribute('open');
  });
  const noMatch = document.getElementById('slotNoMatch');
  if(noMatch){
    noMatch.style.display = (q && totalVisible===0) ? '' : 'none';
    const termEl = document.getElementById('slotNoMatchTerm');
    if(termEl) termEl.textContent = input ? input.value.trim() : '';
  }
}
function toggleQaBase(id){
  const d = window.__qaDraft; const i = d.baseIds.indexOf(id);
  if(i===-1) d.baseIds.push(id); else d.baseIds.splice(i,1);
  const el = document.querySelector(`#qaBaseChips [data-id="${id}"]`); if(el) el.classList.toggle('active');

function toggleQaType(id){
  const d = window.__qaDraft; const i = d.typeIds.indexOf(id);

  const typedName = (document.getElementById('qaName')||{}).value || '';
  const t = getOrCreateMealType(name.trim());
  const keep = window.__qaDraft;
  openSlotEditor(currentSlotDate, currentSlotMeal);
  window.__qaDraft.typeIds = [...keep.typeIds, t.id];
  const el = document.querySelector(`#qaTypeChips [data-id="${t.id}"]`); if(el) el.classList.add('active');

function quickAdd(date, meal){
  const nameEl = document.getElementById('qaName');
  const name = nameEl.value.trim();
  if(!name){ nameEl.focus(); return; }
  const d = window.__qaDraft;
  const recipe = {id:uid(), name, baseIds:[...d.baseIds], typeIds:[...d.typeIds], frequencyWeeks:1, multiply:false, lastUsedWeekStart:null, ephemeral:false};
  state.recipes.push(recipe);
  assignSlot(date, meal, recipe.id);
}
function assignSlot(date, meal, recipeId, forceStatus){
  const day = ensureDay(date);
  if(forceStatus==='out'){ day[meal] = {status:'out', recipeId:null, recipeName:null, baseLabel:null}; }
  else if(forceStatus==='empty'){ day[meal] = emptySlot(); }
  else {
    const r = getRecipe(recipeId);
    day[meal] = {status:'planned', recipeId, recipeName: r?r.name:null, baseLabel: r ? (baseNames(r).join(', ')||null) : null};
    if(r){ r.lastUsedWeekStart = date; removeIfEphemeral(r); }
  }
  saveState();
  refreshLiveShare();
  closeOverlay();
  render();
}

  const t = getOrCreateMealType(name.trim());
  wizard.newItemsQueue[wizard.newItemsIndex].typeIds.push(t.id);
  showCategorizeNewItem();
}
function nextNewItem(){
  if(wizard.newItemsIndex+1 < wizard.newItemsQueue.length){
    wizard.newItemsIndex++;
    showCategorizeNewItem();
  } else {
    generatePlan();
  }
}

/* ============================================================
   PLAN GENERATION
   ============================================================ */
function generatePlan(){
  wizard.newText = document.getElementById('wizNew').value;
  const startISO = wizard.startDate;
  const endISO = wizard.endDate;
  const days = datesBetween(startISO, endISO);
  const hasContent = days.some(date=>{ const d=peekDay(date); return d.lunch.status!=='empty'||d.dinner.status!=='empty'; });
  if(hasContent && !confirm('Some of these days already have a plan. Replace it?')) return;

  days.forEach(date=>{ state.days[date] = {lunch:emptySlot(), dinner:emptySlot()}; });

  const slotOrder = [];
  days.forEach(date=>{
    ['lunch','dinner'].forEach(meal=>{
      const key = date+'_'+meal;
      const day = state.days[date];
      if(wizard.skips[key]) day[meal] = {status:'out', recipeId:null, recipeName:null, baseLabel:null};
      else slotOrder.push({date,meal});
    });
  });

  // ---- priority items: freezer + new-to-try go straight into the first slots ----
  const priorityPool = [];
  const freezerItems = parseList(wizard.freezerText);
  if(freezerItems.length){
    const freezerType = getOrCreateMealType('Freezer');
    freezerItems.forEach(name=>{
      const r = {id:uid(), name, baseIds:[], typeIds:[freezerType.id], frequencyWeeks:1, multiply:false, lastUsedWeekStart:null, ephemeral:true};
      state.recipes.push(r);
      priorityPool.push(r);
    });
  }
  const newItems = (wizard.newItemsQueue && wizard.newItemsQueue.length) ? wizard.newItemsQueue : parseList(wizard.newText).map(name=>({name, baseIds:[], typeIds:[]}));
  if(newItems.length){
    const newType = getOrCreateMealType('New');
    newItems.forEach(item=>{
      const typeIds = Array.from(new Set([...(item.typeIds||[]), newType.id]));
      const r = {id:uid(), name:item.name, baseIds:item.baseIds||[], typeIds, frequencyWeeks:1, multiply:false, lastUsedWeekStart:null, ephemeral:false};
      state.recipes.push(r);
      priorityPool.push(r);
    });
  }

  const usedIds = new Set(priorityPool.map(r=>r.id));
  const priorityCount = Math.min(priorityPool.length, slotOrder.length);
  for(let i=0;i<priorityCount;i++){
    const r = priorityPool[i];
    const slot = slotOrder[i];
    const day = state.days[slot.date];
    day[slot.meal] = {status:'planned', recipeId:r.id, recipeName:r.name, baseLabel: baseNames(r).join(', ')||null};
    r.lastUsedWeekStart = slot.date;
  }
  priorityPool.slice(0,priorityCount).forEach(r=>removeIfEphemeral(r));
  const remainingSlots = slotOrder.slice(priorityCount);

  if(remainingSlots.length){
    const season = getSeason(startISO);
    const fancy = wizard.fancyBaseIds || [];

    function seasonOk(r){
      return !(r.baseIds||[]).some(id=>{ const b=getMealBase(id); return b && (b.excludedSeasons||[]).includes(season); });
    }
    function freqOk(r){
      const freq = r.frequencyWeeks || 1;
      return !(r.lastUsedWeekStart && weeksBetween(r.lastUsedWeekStart, startISO) < freq);
    }
    function lruSort(list){
      return list.sort((a,b)=>{
        const av=a.lastUsedWeekStart||'0000-00-00', bv=b.lastUsedWeekStart||'0000-00-00';
        if(av===bv) return Math.random()-0.5;
        return av<bv?-1:1;
      });
    }

    let candidates = state.recipes.filter(r=>!usedIds.has(r.id) && !r.ephemeral && freqOk(r) && seasonOk(r));
    candidates = lruSort(candidates.filter(r=>!fancy.length || (r.baseIds||[]).some(id=>fancy.includes(id))));

    const copiesFor = new Map();
    function decideCopies(r){
      if(copiesFor.has(r.id)) return copiesFor.get(r.id);
      const c = r.multiply ? (Math.random()<0.5?2:3) : 1;
      copiesFor.set(r.id, c);
      return c;
    }

    function hasBusyTag(r){
      return (r.typeIds||[]).some(id=>{ const t=getMealType(id); return t && t.busyDay; });
    }

    const selected = [], selectedIds = new Set();
    let unitsUsed = 0;
    const baseCounts = {}, typeCounts = {};
    function tryAdd(r){
      if(selectedIds.has(r.id) || unitsUsed>=remainingSlots.length) return false;
      const copies = decideCopies(r);
      selected.push(r); selectedIds.add(r.id); unitsUsed += copies;
      (r.baseIds||[]).forEach(id=>baseCounts[id]=(baseCounts[id]||0)+1);
      (r.typeIds||[]).forEach(id=>typeCounts[id]=(typeCounts[id]||0)+1);
      return true;
    }

    // pass 0: if a busiest day was picked, make sure enough easy (busy-tagged) meals
    // are selected to cover that day's slots before anything else is chosen
    if(wizard.busyDate){
      const busySlotCount = remainingSlots.filter(s=>s.date===wizard.busyDate).length;
      let guard=0;
      while((typeCounts.__busy||0) < busySlotCount && guard<10){
        guard++;
        const c = candidates.find(r=>!selectedIds.has(r.id) && hasBusyTag(r));
        if(!c) break;
        tryAdd(c);
        typeCounts.__busy = (typeCounts.__busy||0) + 1;
      }
    }
    // pass 1: meet meal-type weekly minimums (global rule)
    state.mealTypes.filter(t=>t.weeklyMin>0).forEach(t=>{
      let guard=0;
      while((typeCounts[t.id]||0) < t.weeklyMin && guard<50){
        guard++;
        const c = candidates.find(r=>!selectedIds.has(r.id) && (r.typeIds||[]).includes(t.id));
        if(!c || !tryAdd(c)) break;
      }
    });
    // pass 2: meet meal-base weekly targets (global rule)
    state.mealBases.filter(b=>b.weeklyTarget>0).forEach(b=>{
      let guard=0;
      while((baseCounts[b.id]||0) < b.weeklyTarget && guard<50){
        guard++;
        const c = candidates.find(r=>!selectedIds.has(r.id) && (r.baseIds||[]).includes(b.id));
        if(!c || !tryAdd(c)) break;
      }
    });
    // pass 3: fill whatever's left with the next-in-rotation candidates
    for(const r of candidates){
      if(unitsUsed>=remainingSlots.length) break;
      tryAdd(r);
    }
    // pass 4: if "fancying this week" left too few options to fill the week, fall back
    // to the full recipe pool (still respecting frequency/season) rather than leaving gaps
    if(unitsUsed < remainingSlots.length && fancy.length){
      const fallback = lruSort(state.recipes.filter(r=>!usedIds.has(r.id) && !r.ephemeral && !selectedIds.has(r.id) && freqOk(r) && seasonOk(r)));
      for(const r of fallback){
        if(unitsUsed>=remainingSlots.length) break;
        tryAdd(r);
      }
    }

    // a recipe tagged "prefers lunch/dinner" gets first refusal on that slot type (soft, not a hard rule)
    function prefersSlot(r, mealType){
      return (r.typeIds||[]).some(id=>{
        const t = getMealType(id);
        return t && t.slotPref === mealType;
      });
    }
    // avoid two meals sharing a meal base (e.g. two stews) landing on the same day
    function hasBaseConflictOnDay(r, date){
      const day = state.days[date];
      if(!day || !(r.baseIds||[]).length) return false;
      return ['lunch','dinner'].some(meal=>{
        const slot = day[meal];
        if(slot.status!=='planned' || !slot.recipeId) return false;
        const other = getRecipe(slot.recipeId);
        return other && (r.baseIds||[]).some(id=>(other.baseIds||[]).includes(id));
      });
    }
    // try each predicate in order against the queue; first match wins, else just take the front
    function pickFromQueue(queue, predicates){
      for(const pred of predicates){
        const idx = queue.findIndex(pred);
        if(idx!==-1) return idx;
      }
      return 0;
    }

    // place multi-copy recipes first: never twice on the same day, and every copy
    // must land within 2 days of its first appearance so it doesn't sprawl across the week
    let openSlots = remainingSlots.slice();
    const multiplyRecipes = selected.filter(r=>decideCopies(r)>1);
    const singleRecipes = selected.filter(r=>decideCopies(r)<=1);

    multiplyRecipes.forEach(r=>{
      if(!openSlots.length) return;
      const copies = decideCopies(r);
      // prefer to start away from the busiest day and away from a same-day base conflict
      let startIdx = openSlots.findIndex(s=>s.date!==wizard.busyDate && !hasBaseConflictOnDay(r,s.date));
      if(startIdx===-1) startIdx = openSlots.findIndex(s=>s.date!==wizard.busyDate);
      if(startIdx===-1) startIdx = 0;
      const [startSlot] = openSlots.splice(startIdx,1);
      const startDate = startSlot.date;
      const maxDate = addDays(startDate, 2);
      const placements = [startSlot];
      const usedDates = new Set([startDate]);
      for(let k=1;k<copies;k++){
        let idx = openSlots.findIndex(s=>!usedDates.has(s.date) && s.date<=maxDate && s.date!==wizard.busyDate && !hasBaseConflictOnDay(r,s.date));
        if(idx===-1) idx = openSlots.findIndex(s=>!usedDates.has(s.date) && s.date<=maxDate && s.date!==wizard.busyDate);
        if(idx===-1) idx = openSlots.findIndex(s=>!usedDates.has(s.date) && s.date<=maxDate);
        if(idx===-1) break; // couldn't fit another copy within the window — place what we can
        const [s] = openSlots.splice(idx,1);
        placements.push(s);
        usedDates.add(s.date);
      }
      placements.forEach(slot=>{
        const day = state.days[slot.date];
        day[slot.meal] = {status:'planned', recipeId:r.id, recipeName:r.name, baseLabel: baseNames(r).join(', ')||null};
      });
      r.lastUsedWeekStart = placements[0].date;
    });

    // place the remaining single-copy recipes into whatever slots are left —
    // the busiest day gets first refusal on any easy (busy-tagged) recipes,
    // other days actively avoid using them up while alternatives exist, and
    // nothing sharing a meal base with that day's other meal is picked if avoidable
    const queue = singleRecipes.slice();
    const busyModeOn = !!wizard.busyDate;
    openSlots.forEach(slot=>{
      if(!queue.length) return;
      const isBusySlot = busyModeOn && slot.date===wizard.busyDate;
      const noConflict = r=>!hasBaseConflictOnDay(r, slot.date);
      const predicates = [];
      if(isBusySlot){
        predicates.push(r=>hasBusyTag(r) && noConflict(r));
        predicates.push(r=>hasBusyTag(r));
      }
      predicates.push(r=>prefersSlot(r, slot.meal) && noConflict(r));
      if(busyModeOn && !isBusySlot){
        predicates.push(r=>!hasBusyTag(r) && noConflict(r));
        predicates.push(r=>!hasBusyTag(r));
      } else {
        predicates.push(noConflict);
      }
      predicates.push(r=>prefersSlot(r, slot.meal));
      const idx = pickFromQueue(queue, predicates);
      const [r] = queue.splice(idx,1);
      const day = state.days[slot.date];
      day[slot.meal] = {status:'planned', recipeId:r.id, recipeName:r.name, baseLabel: baseNames(r).join(', ')||null};
      r.lastUsedWeekStart = slot.date;
    });
  }

  state.lastViewedWeekStart = startISO;
  viewWeekStart = startISO;
  saveState();
  refreshLiveShare();
  closeOverlay();
  render();

  const filledCount = days.reduce((n,date)=>{ const d=state.days[date]; return n+(d.lunch.status==='planned'?1:0)+(d.dinner.status==='planned'?1:0); },0);
  toast(filledCount < slotOrder.length ? `Planned ${filledCount} of ${slotOrder.length} meals — fill the rest manually` : 'Plan complete');
}

function showOverlay(html){
  document.getElementById('overlayRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeOverlay()">

    </div>`;

/* ============================================================
   SHARE — live link (Firestore) with a snapshot-link fallback
   ============================================================ */
function b64EncodeUnicode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUnicode(str){ return decodeURIComponent(escape(atob(str))); }
function simplifySlot(s){
  if(s.status==='out') return {status:'out'};
  if(s.status==='planned') return {status:'planned', name:s.recipeName||'', base:s.baseLabel||''};
  return {status:'empty'};
}
function buildWeekPayload(weekStart){
  const days = weekDates(weekStart);
  return {
    start: days[0],
    end: days[6],
    days: days.map(date=>{
      const d = peekDay(date);
      return { date, lunch: simplifySlot(d.lunch), dinner: simplifySlot(d.dinner) };
    }),
    updatedAt: Date.now()
  };
}
function buildShareUrl(){
  return `${location.origin}${location.pathname}#live=${encodeURIComponent(shareMeta.shareId)}`;
}
function refreshLiveShare(){
  if(!shareMeta.active || !shareMeta.shareId || !firebaseDb) return;
  firebaseDb.collection('sharedWeeks').doc(shareMeta.shareId)
    .set(buildWeekPayload(shareMeta.weekStart))
    .catch(()=>{ /* best-effort; app keeps working offline either way */ });
}
function copyOrShow(url, msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>toast(msg)).catch(()=>showShareFallback(url, msg));
  } else {
    showShareFallback(url, msg);
  }
}
function shareCurrentWeek(){
  if(!firebaseDb){ alert("Live sharing isn't available right now — check your connection and try again."); return; }
  if(shareMeta.active && shareMeta.weekStart===viewWeekStart){
    showShareInfo();
    return;
  }
  if(shareMeta.active && shareMeta.weekStart!==viewWeekStart){
    if(!confirm(`You're already live-sharing the week of ${dayShort(shareMeta.weekStart)}. Switch the live link to this week instead?`)) return;
  }
  shareMeta.active = true;
  shareMeta.weekStart = viewWeekStart;
  ensureShareId();
  saveShareMeta();
  refreshLiveShare();
  copyOrShow(buildShareUrl(), 'Live link copied — it updates automatically as you edit this week');
}
function showShareInfo(){
  const url = buildShareUrl();
  showOverlay(`
    <h2>Live sharing this week</h2>
    <p class="desc">Anyone with this link sees this week update automatically as you edit it.</p>
    <div class="field"><textarea rows="4" readonly onclick="this.select()">${escapeHtml(url)}</textarea></div>
    <div class="btnrow">
      <button class="btn danger" onclick="stopLiveShare()">Stop sharing</button>
      <button class="btn primary" onclick="closeOverlay()">Done</button>
    </div>
  `);
}
function showShareFallback(url, msg){
  showOverlay(`
    <h2>Live sharing this week</h2>
    <p class="desc">${escapeHtml(msg||'Copy this link — it updates automatically as you edit this week.')}</p>
    <div class="field"><textarea rows="4" readonly onclick="this.select()">${escapeHtml(url)}</textarea></div>
    <div class="btnrow">
      <button class="btn danger" onclick="stopLiveShare()">Stop sharing</button>
      <button class="btn primary" onclick="closeOverlay()">Done</button>
    </div>
  `);
}
function stopLiveShare(){
  if(shareMeta.shareId && firebaseDb){
    firebaseDb.collection('sharedWeeks').doc(shareMeta.shareId).delete().catch(()=>{});
  }
  shareMeta.active = false;
  saveShareMeta();
  closeOverlay();
  toast('Live sharing stopped');
}
function renderSharedView(payload, live){
  const app = document.getElementById('app');
  const firstLabel = fromISO(payload.start).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  const lastLabel = fromISO(payload.end).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  const daysHtml = payload.days.map(d=>`
    <div class="daycard">
      <div class="dayhead">
        <span class="dname">${dayName(d.date)}</span>
        <span class="ddate">${dayShort(d.date)}</span>
      </div>
      ${renderSharedMealRow('lunch', d.lunch)}
      ${renderSharedMealRow('dinner', d.dinner)}
    </div>`).join('');
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <span class="kicker">shared meal plan · ${live?'live':'view only'}</span>
        <h1>Meal Plan</h1>
      </div>
    </div>
    <div class="weeknav">
      <div class="range" style="margin:0 auto;">${firstLabel} – ${lastLabel}</div>
    </div>
    <div class="week-wrap">${daysHtml}</div>
    <p class="hint">${live ? "This updates automatically as they edit — nothing here can be edited by you." : "This is a snapshot shared as a link — nothing here can be edited, and it won't reflect later changes."}</p>
  `;
}
function renderSharedMessage(text){
  document.getElementById('app').innerHTML = `
    <div class="topbar"><div class="brand"><h1>Meal Plan</h1></div></div>
    <p class="hint" style="margin-top:40px;">${escapeHtml(text)}</p>
  `;
}
function listenLiveShare(shareId){
  renderSharedMessage('Loading…');
  if(!firebaseDb){ renderSharedMessage("Couldn't connect to load this shared plan."); return; }
  firebaseDb.collection('sharedWeeks').doc(shareId).onSnapshot(doc=>{
    if(!doc.exists){ renderSharedMessage('This link is no longer being shared.'); return; }
    renderSharedView(doc.data(), true);
  }, ()=>{
    renderSharedMessage("Couldn't load this shared plan.");
  });
}
function renderSharedMealRow(meal, slot){
  let inner;
  if(slot.status==='out') inner = `<div class="slot out">Out — no meal needed</div>`;
  else if(slot.status==='planned') inner = `<div class="slot planned"><span class="rname">${escapeHtml(slot.name)}</span><span class="rcat">${escapeHtml(slot.base)}</span></div>`;
  else inner = `<div class="slot empty">Not planned</div>`;
  return `<div class="meal-row"><span class="meal-label">${meal}</span>${inner}</div>`;
}

/* ---- meal bases ---- */
function renderMealBasesSection(){
  const rows = state.mealBases.map(b=>{
    const seasonChips = SEASONS.map(s=>`<button type="button" class="chip season-chip ${((b.excludedSeasons||[]).includes(s))?'active':''}" onclick="toggleBaseSeason('${b.id}','${s}')">${s}</button>`).join('');
    return `
    <div class="rule-row">
      <input type="text" value="${escapeHtml(b.name)}" onchange="renameMealBase('${b.id}',this.value)">
      <div class="target-stepper">
        <button onclick="bumpBaseTarget('${b.id}',-1)">–</button>
        <span class="tval">${b.weeklyTarget}/wk</span>
        <button onclick="bumpBaseTarget('${b.id}',1)">+</button>
      </div>
      <button class="del-x" onclick="deleteMealBase('${b.id}')">✕</button>
      <div class="season-row">
        <span class="season-label">out of season:</span>
        <div class="chip-group">${seasonChips}</div>
      </div>
    </div>`;
  }).join('');
  return `
    <div class="cat-card">
      <h3 class="section-title">Meal bases</h3>
      <p class="section-desc">The core of the meal — pasta, rice, etc. A recipe can use more than one. The weekly target is a global rule for how many times it should show up each week. Mark a base "out of season" for any season and the auto-planner won't pull it then.</p>
      ${rows || '<p class="hint">No meal bases yet.</p>'}
      <div class="add-cat-form">
        <input type="text" id="newBaseName" placeholder="e.g. Couscous">
        <button onclick="addMealBase()">Add</button>
      </div>
    </div>`;
}
function addMealBase(){
  const input = document.getElementById('newBaseName');
  const name = input.value.trim();
  if(!name) return;
  state.mealBases.push({id:uid(), name, weeklyTarget:1, excludedSeasons:[]});
  saveState(); render();
}
function renameMealBase(id, name){
  const b = getMealBase(id); if(b){ b.name = name.trim()||b.name; saveState(); }
}
function bumpBaseTarget(id, delta){
  const b = getMealBase(id); b.weeklyTarget = Math.max(0,(b.weeklyTarget||0)+delta);
  saveState(); render();
}
function toggleBaseSeason(id, season){
  const b = getMealBase(id); if(!b) return;
  b.excludedSeasons = b.excludedSeasons || [];
  const i = b.excludedSeasons.indexOf(season);
  if(i===-1) b.excludedSeasons.push(season); else b.excludedSeasons.splice(i,1);
  saveState(); render();
}
function deleteMealBase(id){
  if(!confirm('Delete this meal base? Recipes using it will just lose that tag.')) return;
  state.mealBases = state.mealBases.filter(b=>b.id!==id);
  state.recipes.forEach(r=>{ r.baseIds = (r.baseIds||[]).filter(bid=>bid!==id); });
  saveState(); render();
}

  saveState(); render();
}
function setTypeSlotPref(id, val){
  const t = getMealType(id); if(t){ t.slotPref = val || null; saveState(); }
}
function setTypeBusyDay(id, checked){
  const t = getMealType(id); if(t){ t.busyDay = !!checked; saveState(); }
}
function deleteMealType(id){
  if(!confirm('Delete this meal type? Recipes using it will just lose that tag.')) return;
  state.mealTypes = state.mealTypes.filter(t=>t.id!==id);
  state.recipes.forEach(r=>{ r.typeIds = (r.typeIds||[]).filter(tid=>tid!==id); });
  saveState(); render();
}

/* ---- recipes (flat list + editor modal) ---- */
function renderRecipesSection(){
  const rows = state.recipes.filter(r=>!r.ephemeral).map(r=>{
    const bases = baseNames(r).join(', ') || 'no base yet';
    const types = typeNames(r).join(', ');
    return `
    <div class="recipe-row" onclick="openRecipeEditor('${r.id}')">
      <div class="rinfo">
        <div class="rn">${escapeHtml(r.name)}</div>
        <div class="rmeta">${escapeHtml(bases)}${types?' · '+escapeHtml(types):''} · ${freqLabel(r)}</div>
      </div>
      <span class="chev">›</span>
    </div>`;
  }).join('');
  return `
    <div class="cat-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;gap:8px;">
        <h3 class="section-title" style="margin:0;">Recipes</h3>
        <div style="display:flex;gap:6px;flex:none;">
          <button class="btn small" style="background:var(--mustard);color:var(--mustard-ink);" onclick="openBulkImport()">Bulk import</button>
          <button class="btn small" style="background:var(--sage-dark);color:#fff;" onclick="openRecipeEditor(null)">+ Add</button>
        </div>
      </div>
      <p class="section-desc">Tap a recipe to edit its bases, types, and rotation.</p>
      ${rows || '<p class="hint">No recipes yet — add your first one.</p>'}
    </div>`;
}

/* ---- bulk import: paste names, categorize each one, then save them all ---- */
let bulkImport = { queue:[], index:0 };
function openBulkImport(){
  showOverlay(`
    <h2>Bulk import recipes</h2>
    <p class="desc">Paste recipe names — one per line or separated by commas. You'll quickly tag each one next.</p>
    <div class="field">
      <textarea id="bulkImportText" rows="6" placeholder="e.g. Chicken traybake, Fish pie, Veggie chilli"></textarea>
    </div>
    <div class="btnrow">
      <button class="btn ghost" onclick="closeOverlay()">Cancel</button>
      <button class="btn primary" onclick="startBulkImport()">Next</button>
    </div>
  `);
}
function startBulkImport(){
  const names = parseList(document.getElementById('bulkImportText').value);
  if(!names.length){ closeOverlay(); return; }
  bulkImport = { queue: names.map(name=>({name, baseIds:[], typeIds:[], frequencyWeeks:1, multiply:false})), index:0 };
  showBulkImportItem();
}
function showBulkImportItem(){
  const item = bulkImport.queue[bulkImport.index];
  const total = bulkImport.queue.length;
  const baseChips = state.mealBases.map(b=>`<button type="button" class="chip ${item.baseIds.includes(b.id)?'active':''}" data-id="${b.id}" onclick="toggleBulkImportBase('${b.id}')">${escapeHtml(b.name)}</button>`).join('')
    + `<button type="button" class="chip" style="border-style:dashed;" onclick="bulkImportNewBase()">+ new</button>`;
  const typeChips = state.mealTypes.map(t=>`<button type="button" class="chip type-chip ${item.typeIds.includes(t.id)?'active':''}" data-id="${t.id}" onclick="toggleBulkImportType('${t.id}')">${escapeHtml(t.name)}</button>`).join('')
    + `<button type="button" class="chip type-chip" style="border-style:dashed;" onclick="bulkImportNewType()">+ new</button>`;
  showOverlay(`
    <p class="desc" style="margin-bottom:4px;">Recipe ${bulkImport.index+1} of ${total}</p>
    <h2>${escapeHtml(item.name)}</h2>
    <div class="field">
      <label>Meal base — pick any that apply</label>
      <div class="chip-group" id="bulkImportBaseChips">${baseChips}</div>
    </div>
    <div class="field">
      <label>Meal type — pick any that apply</label>
      <div class="chip-group" id="bulkImportTypeChips">${typeChips}</div>
    </div>
    <div class="field">
      <label>How often can it repeat across weeks?</label>
      <select id="bulkImportFreq" onchange="bulkImport.queue[bulkImport.index].frequencyWeeks=parseInt(this.value,10)||1">
        ${[1,2,3,4,5,6,8].map(n=>`<option value="${n}" ${item.frequencyWeeks===n?'selected':''}>${n===1?'every week is fine':'every '+n+' weeks'}</option>`).join('')}
      </select>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);margin-bottom:6px;">
      <input type="checkbox" style="width:18px;height:18px;accent-color:var(--brick);" ${item.multiply?'checked':''} onchange="bulkImport.queue[bulkImport.index].multiply=this.checked">
      can repeat 2-3x in the same week
    </label>
    <div class="btnrow">
      <button class="btn ghost" onclick="skipBulkImportItem()">Skip this one</button>
      <button class="btn primary" onclick="nextBulkImportItem()">${bulkImport.index+1<total?'Save & next':'Save & finish'}</button>
    </div>
  `);
}
function toggleBulkImportBase(id){
  const item = bulkImport.queue[bulkImport.index];
  const i = item.baseIds.indexOf(id);
  if(i===-1) item.baseIds.push(id); else item.baseIds.splice(i,1);
  const el = document.querySelector(`#bulkImportBaseChips [data-id="${id}"]`); if(el) el.classList.toggle('active');
}
function toggleBulkImportType(id){
  const item = bulkImport.queue[bulkImport.index];
  const i = item.typeIds.indexOf(id);
  if(i===-1) item.typeIds.push(id); else item.typeIds.splice(i,1);
  const el = document.querySelector(`#bulkImportTypeChips [data-id="${id}"]`); if(el) el.classList.toggle('active');
}
function bulkImportNewBase(){
  const name = prompt('New meal base name:');
  if(!name || !name.trim()) return;
  const b = getOrCreateMealBase(name.trim());
  bulkImport.queue[bulkImport.index].baseIds.push(b.id);
  showBulkImportItem();
}
function bulkImportNewType(){
  const name = prompt('New meal type name:');
  if(!name || !name.trim()) return;
  const t = getOrCreateMealType(name.trim());
  bulkImport.queue[bulkImport.index].typeIds.push(t.id);
  showBulkImportItem();
}
function skipBulkImportItem(){
  bulkImport.queue.splice(bulkImport.index,1);
  finishOrShowNextBulkImportItem();
}
function nextBulkImportItem(){
  bulkImport.index++;
  finishOrShowNextBulkImportItem();
}
function finishOrShowNextBulkImportItem(){
  if(bulkImport.index >= bulkImport.queue.length){
    const added = bulkImport.queue.length;
    bulkImport.queue.forEach(item=>{
      state.recipes.push({id:uid(), name:item.name, baseIds:item.baseIds, typeIds:item.typeIds, frequencyWeeks:item.frequencyWeeks||1, multiply:!!item.multiply, lastUsedWeekStart:null, ephemeral:false});
    });
    bulkImport = { queue:[], index:0 };
    saveState();
    closeOverlay();
    render();
    toast(added ? `Added ${added} recipe${added===1?'':'s'}` : 'Nothing to add');
    return;
  }
  showBulkImportItem();
}

let editingRecipeId = null;
function openRecipeEditor(id){
  editingRecipeId = id;
  const r = id ? getRecipe(id) : {name:'', baseIds:[], typeIds:[], frequencyWeeks:1, multiply:false};
  window.__editorDraft = { baseIds:[...(r.baseIds||[])], typeIds:[...(r.typeIds||[])] };

  const baseChips = state.mealBases.map(b=>`<button type="button" class="chip ${(r.baseIds||[]).includes(b.id)?'active':''}" data-id="${b.id}" onclick="toggleEditorBase('${b.id}')">${escapeHtml(b.name)}</button>`).join('')
    + `<button type="button" class="chip" style="border-style:dashed;" onclick="editorNewBase()">+ new</button>`;
  const typeChips = state.mealTypes.map(t=>`<button type="button" class="chip type-chip ${(r.typeIds||[]).includes(t.id)?'active':''}" data-id="${t.id}" onclick="toggleEditorType('${t.id}')">${escapeHtml(t.name)}</button>`).join('')
    + `<button type="button" class="chip type-chip" style="border-style:dashed;" onclick="editorNewType()">+ new</button>`;

  showOverlay(`
    <h2>${id?'Edit recipe':'Add a recipe'}</h2>
    <div class="field">
      <label>Name</label>
      <input type="text" id="editRecipeName" value="${escapeHtml(r.name)}" placeholder="e.g. Chicken traybake">
    </div>
    <div class="field">
      <label>Meal base — pick any that apply</label>
      <div class="chip-group" id="editBaseChips">${baseChips}</div>
    </div>
    <div class="field">
      <label>Meal type — pick any that apply</label>
      <div class="chip-group" id="editTypeChips">${typeChips}</div>
    </div>
    <div class="field">
      <label>How often can it repeat across weeks?</label>
      <select id="editRecipeFreq">
        ${[1,2,3,4,5,6,8].map(n=>`<option value="${n}" ${(r.frequencyWeeks||1)===n?'selected':''}>${n===1?'every week is fine':'every '+n+' weeks'}</option>`).join('')}
      </select>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);margin-bottom:6px;">
      <input type="checkbox" style="width:18px;height:18px;accent-color:var(--brick);" id="editRecipeMultiply" ${r.multiply?'checked':''}>
      can repeat 2-3x in the same week
    </label>
    <div class="btnrow">
      ${id?`<button class="btn danger" onclick="deleteRecipeFromEditor('${id}')">Delete</button>`:`<button class="btn ghost" onclick="closeOverlay()">Cancel</button>`}
      <button class="btn primary" onclick="saveRecipeFromEditor()">Save</button>
    </div>
  `);
}
function toggleEditorBase(id){
  const d = window.__editorDraft; const i = d.baseIds.indexOf(id);
  if(i===-1) d.baseIds.push(id); else d.baseIds.splice(i,1);
  const el = document.querySelector(`#editBaseChips [data-id="${id}"]`); if(el) el.classList.toggle('active');
}
function toggleEditorType(id){
  const d = window.__editorDraft; const i = d.typeIds.indexOf(id);
  if(i===-1) d.typeIds.push(id); else d.typeIds.splice(i,1);
  const el = document.querySelector(`#editTypeChips [data-id="${id}"]`); if(el) el.classList.toggle('active');
}
function editorNewBase(){
  const name = prompt('New meal base name:');
  if(!name || !name.trim()) return;
  const b = getOrCreateMealBase(name.trim());
  window.__editorDraft.baseIds.push(b.id);
  reopenRecipeEditorPreservingName();
}
function editorNewType(){
  const name = prompt('New meal type name:');
  if(!name || !name.trim()) return;
  const t = getOrCreateMealType(name.trim());
  window.__editorDraft.typeIds.push(t.id);
  reopenRecipeEditorPreservingName();
}
function reopenRecipeEditorPreservingName(){
  const typedName = (document.getElementById('editRecipeName')||{}).value || '';
  const keepDraft = window.__editorDraft;
  openRecipeEditor(editingRecipeId);
  window.__editorDraft = keepDraft;
  keepDraft.baseIds.forEach(id=>{ const el=document.querySelector(`#editBaseChips [data-id="${id}"]`); if(el) el.classList.add('active'); });
  keepDraft.typeIds.forEach(id=>{ const el=document.querySelector(`#editTypeChips [data-id="${id}"]`); if(el) el.classList.add('active'); });
  const nameEl = document.getElementById('editRecipeName'); if(nameEl) nameEl.value = typedName;
}
function saveRecipeFromEditor(){
  const name = document.getElementById('editRecipeName').value.trim();
  if(!name) return;
  const freq = parseInt(document.getElementById('editRecipeFreq').value,10)||1;
  const multiply = document.getElementById('editRecipeMultiply').checked;
  const d = window.__editorDraft;
  if(editingRecipeId){
    const r = getRecipe(editingRecipeId);
    r.name=name; r.baseIds=d.baseIds; r.typeIds=d.typeIds; r.frequencyWeeks=freq; r.multiply=multiply;
  } else {
    state.recipes.push({id:uid(), name, baseIds:d.baseIds, typeIds:d.typeIds, frequencyWeeks:freq, multiply, lastUsedWeekStart:null, ephemeral:false});
  }
  saveState();
  closeOverlay();
  render();
}
function deleteRecipeFromEditor(id){
  if(!confirm('Delete this recipe?')) return;
  state.recipes = state.recipes.filter(r=>r.id!==id);
  saveState();
  closeOverlay();
  render();
}

/* ============================================================
   BACKUP
   ============================================================ */
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'meal-plan-backup.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data.mealBases || !data.mealTypes || !data.recipes || !data.days) throw new Error('bad file');
      state = data;
      saveState();
      toast('Backup restored');
      render();
    }catch(e){ alert('Could not read that file.'); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

/* ============================================================
   PDF EXPORT
   ============================================================ */
function downloadWeekPdf(){
  if(!window.jspdf){
    alert('The PDF library didn\'t load — check your internet connection and try again.');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margin = 54;
  const ink = [51,41,28], soft = [140,124,99], brick=[214,84,55], sage=[24,110,99], line=[236,222,192];
  let y = 64;

  const days = weekDates(viewWeekStart);
  const firstLabel = fromISO(days[0]).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  const lastLabel = fromISO(days[6]).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});

  doc.setFont('times','bold');
  doc.setFontSize(24);
  doc.setTextColor(...ink);
  doc.text('Meal Plan', margin, y);
  y += 20;
  doc.setFont('helvetica','normal');
  doc.setFontSize(11.5);
  doc.setTextColor(...soft);
  doc.text(`${firstLabel} \u2013 ${lastLabel}`, margin, y);
  y += 18;
  doc.setDrawColor(...line);
  doc.setLineWidth(1);
  doc.line(margin, y, pageWidth-margin, y);
  y += 28;

  days.forEach((date)=>{
    const d = peekDay(date);
    if(y > pageHeight - 100){ doc.addPage(); y = 64; }

    doc.setFont('times','bold');
    doc.setFontSize(15);
    doc.setTextColor(...ink);
    doc.text(dayName(date), margin, y);
    const nameWidth = doc.getTextWidth(dayName(date));
    doc.setFont('helvetica','normal');
    doc.setFontSize(10.5);
    doc.setTextColor(...soft);
    doc.text(dayShort(date), margin + nameWidth + 10, y);
    y += 20;

    ['lunch','dinner'].forEach(meal=>{
      const slot = d[meal];
      doc.setFont('helvetica','bold');
      doc.setFontSize(10);
      doc.setTextColor(...(meal==='lunch'?brick:sage));
      doc.text(meal.toUpperCase(), margin + 14, y);

      let label, italic=false;
      if(slot.status==='out'){ label = 'Out — no meal needed'; italic=true; }
      else if(slot.status==='planned'){
        const recipe = slot.recipeId ? getRecipe(slot.recipeId) : null;
        const name = slot.recipeName || (recipe ? recipe.name : '');
        const baseTxt = slot.baseLabel || (recipe ? baseNames(recipe).join(', ') : '');
        label = name ? (name + (baseTxt ? `  (${baseTxt})` : '')) : 'Not planned';
        if(!name) italic = true;
      } else { label = 'Not planned'; italic=true; }

      doc.setFont('helvetica', italic ? 'italic' : 'normal');
      doc.setFontSize(11.5);
      doc.setTextColor(...ink);
      doc.text(label, margin + 78, y);
      y += 18;
    });

    y += 8;
    doc.setDrawColor(...line);
    doc.setLineWidth(0.75);
    doc.line(margin, y, pageWidth-margin, y);
    y += 20;
  });

  doc.setFont('helvetica','normal');
  doc.setFontSize(8.5);
  doc.setTextColor(...soft);
  doc.text('Meal Plan', margin, pageHeight-30);

  doc.save(`meal-plan-${viewWeekStart}.pdf`);
}

/* ---------- init ---------- */
function initApp(){
  const hash = window.location.hash || '';
  if(hash.startsWith('#live=')){
    const shareId = decodeURIComponent(hash.slice(6));
    listenLiveShare(shareId);
    return;
  }
  if(hash.startsWith('#share=')){
    try{
      const encoded = decodeURIComponent(hash.slice(7));
      const payload = JSON.parse(b64DecodeUnicode(encoded));
      renderSharedView(payload, false);
      return;
    }catch(e){ /* fall through to the normal app if the link is malformed */ }
  }
  render();
}
initApp();
</script>
